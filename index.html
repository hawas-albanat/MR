
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#166534">
<meta name="description" content="دليل أسعار المحل">
<link rel="manifest" href="./manifest.json">
<title>دليل أسعار المحل</title>
<style>
:root{--green:#166534;--light:#f3f7f3;--border:#e0e7e0}
*{box-sizing:border-box}
body{margin:0;background:var(--light);font-family:Arial,Tahoma,sans-serif;color:#17251b}
header{background:var(--green);color:white;padding:22px 16px 28px}
header h1{margin:0 0 7px;font-size:25px}
header p{margin:0;color:#e3f4e5;font-size:14px}
main{max-width:850px;margin:auto;padding:15px}
.panel{background:white;border:1px solid var(--border);border-radius:15px;padding:15px;margin-bottom:15px}
h2{font-size:18px;margin:0 0 13px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd5cb;border-radius:10px;background:white;margin:5px 0 10px}
button{border:0;border-radius:10px;padding:11px 14px;background:var(--green);color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5}
.secondary{background:#e8f2e9;color:#14532d}
.danger{background:#fee2e2;color:#991b1b}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.row button{flex:0 0 auto}
#categories{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px}
.cat{white-space:nowrap;background:#e8f2e9;color:#14532d}
.cat.active{background:var(--green);color:white}
#products{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}
.product{border:1px solid var(--border);border-radius:13px;overflow:hidden;background:white;min-width:0}
.product img{width:100%;height:145px;object-fit:cover;background:#edf2ed}
.product .info{padding:10px}
.product h3{font-size:16px;margin:0 0 8px;overflow-wrap:anywhere}
.price{font-size:19px;color:var(--green);font-weight:bold;margin-bottom:8px}
.notes{font-size:13px;color:#647067;overflow-wrap:anywhere;margin-bottom:8px}
.actions{display:flex;gap:5px}
.actions button{font-size:12px;padding:8px 9px}
#status{font-size:14px;white-space:pre-wrap;margin:8px 0}
#status.error{color:#b91c1c}
#status.ok{color:#166534}
small{color:#657168}
.preview{width:90px;height:90px;object-fit:cover;border-radius:10px;display:none;margin:5px 0}
label{font-size:14px;font-weight:bold;display:block}
.empty{grid-column:1/-1;text-align:center;padding:25px;color:#68746b}
</style>
</head>
<body>
<header>
<h1>📋 دليل أسعار المحل</h1>
<p>كل أسعار منتجاتك وأقسامك في مكان واحد</p>
</header>
<main>
<div class="panel">
<h2>🔎 البحث عن منتج</h2>
<input id="search" placeholder="اكتب اسم المنتج..." autocomplete="off">
<div id="status">جاري الاتصال بقاعدة البيانات...</div>
</div>

<div class="panel">
<div class="row" style="align-items:center">
<h2 style="flex:1">📂 الأقسام</h2>
<button id="addCat" type="button">+ قسم جديد</button>
</div>
<div id="categories"></div>
<div id="catForm" hidden>
<label for="catName">اسم القسم</label>
<input id="catName" placeholder="مثال: منظفات">
<div class="row">
<button id="saveCat" type="button">حفظ القسم</button>
<button id="cancelCat" class="secondary" type="button">إلغاء</button>
</div>
</div>
</div>

<div class="panel">
<div class="row" style="align-items:center">
<h2 style="flex:1">🛍️ المنتجات</h2>
<button id="addProduct" type="button">+ منتج جديد</button>
</div>
<div id="productForm" hidden>
<label for="pName">اسم المنتج *</label>
<input id="pName" placeholder="اسم المنتج">
<label for="pPrice">السعر بالجنيه *</label>
<input id="pPrice" type="number" min="0" step="0.01" placeholder="0.00">
<label for="pCategory">القسم *</label>
<select id="pCategory"></select>
<label for="pNotes">ملاحظات (اختياري)</label>
<textarea id="pNotes" rows="2" placeholder="تفاصيل المنتج"></textarea>
<label for="pImage">صورة من الجهاز أو الكاميرا</label>
<input id="pImage" type="file" accept="image/*">
<img id="preview" class="preview" alt="معاينة الصورة">
<div class="row">
<button id="saveProduct" type="button">حفظ المنتج</button>
<button id="cancelProduct" class="secondary" type="button">إلغاء</button>
</div>
<small>يمكنك اختيار صورة من المعرض أو التصوير إذا ظهر خيار الكاميرا.</small>
</div>
</div>

<div id="products"></div>
<p style="text-align:center"><small>تحتاج إضافة وتعديل البيانات إلى اتصال بالإنترنت.</small></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://sovxdgvrwbohhyuhktnp.supabase.co";
const SUPABASE_KEY = "sb_publishable_itvtDhJzdXH1X3GUoshKkg_neEvjG3i";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $ = id => document.getElementById(id);
let categories = [], products = [], selectedCategory = "all";
let editingProduct = null, editingCategory = null, imageUrl = "";
const status = $("status");

function message(text,error=false){
 status.textContent=text;
 status.className=error?"error":"ok";
}
function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}
function money(value){
 return Number(value).toLocaleString("ar-EG",{maximumFractionDigits:2})+" ج.م";
}
async function loadAll(){
 message("جاري تحميل البيانات...");
 try{
  const [c,p]=await Promise.all([
   db.from("categories").select("id,name,created_at").order("created_at"),
   db.from("products").select("id,name,price,category_id,image_url,notes,created_at").order("created_at",{ascending:false})
  ]);
  if(c.error)throw c.error;
  if(p.error)throw p.error;
  categories=c.data||[];
  products=p.data||[];
  renderCategories();
  renderProducts();
  fillCategorySelect();
  message("تم تحميل البيانات بنجاح.");
 }catch(e){
  console.error(e);
  message("تعذر تحميل البيانات. تأكد من إعداد صلاحيات Supabase والجداول والاتصال بالإنترنت.\n"+(e.message||""),true);
 }
}
function renderCategories(){
 const box=$("categories");
 box.innerHTML="";
 const all=document.createElement("button");
 all.className="cat"+(selectedCategory==="all"?" active":"");
 all.textContent="كل المنتجات";
 all.onclick=()=>{selectedCategory="all";renderCategories();renderProducts()};
 box.appendChild(all);
 categories.forEach(c=>{
  const b=document.createElement("button");
  b.className="cat"+(selectedCategory===c.id?" active":"");
  b.textContent=c.name;
  b.onclick=()=>{selectedCategory=c.id;renderCategories();renderProducts()};
  b.oncontextmenu=e=>{
   e.preventDefault();
   if(confirm("تعديل اسم القسم "+c.name+"؟")) editCategory(c);
  };
  box.appendChild(b);
 });
}
function fillCategorySelect(){
 const select=$("pCategory");
 select.innerHTML='<option value="">اختر القسم</option>'+
 categories.map(c=>`<option value="${escapeHTML(c.id)}">${escapeHTML(c.name)}</option>`).join("");
}
function renderProducts(){
 const term=$("search").value.trim().toLowerCase();
 const list=products.filter(p=>{
  const matchesCategory=selectedCategory==="all"||p.category_id===selectedCategory;
  const category=categories.find(c=>c.id===p.category_id);
  const matchesTerm=(p.name+" "+(p.notes||"")+" "+(category?.name||"")).toLowerCase().includes(term);
  return matchesCategory&&matchesTerm;
 });
 const box=$("products");
 if(!list.length){
  box.innerHTML='<div class="panel empty">لا توجد منتجات هنا حتى الآن.</div>';
  return;
 }
 box.innerHTML=list.map(p=>{
  const category=categories.find(c=>c.id===p.category_id);
  const img=p.image_url?`<img src="${escapeHTML(p.image_url)}" alt="${escapeHTML(p.name)}" loading="lazy">`:
  '<div style="height:145px;display:grid;place-items:center;background:#edf2ed;font-size:42px">🛍️</div>';
  return `<article class="product">${img}<div class="info">
  <h3>${escapeHTML(p.name)}</h3>
  <div class="price">${money(p.price)}</div>
  <small>${escapeHTML(category?.name||"بدون قسم")}</small>
  ${p.notes?`<div class="notes">${escapeHTML(p.notes)}</div>`:""}
  <div class="actions" style="margin-top:10px">
  <button class="secondary" data-edit="${p.id}">تعديل</button>
  <button class="danger" data-delete="${p.id}">حذف</button>
  </div></div></article>`;
 }).join("");
 box.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editProduct(products.find(p=>p.id===b.dataset.edit)));
 box.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteProduct(products.find(p=>p.id===b.dataset.delete)));
}
$("search").addEventListener("input",renderProducts);

$("addCat").onclick=()=>{
 editingCategory=null;
 $("catName").value="";
 $("catForm").hidden=false;
 $("catName").focus();
};
$("cancelCat").onclick=()=>{$("catForm").hidden=true;editingCategory=null};
function editCategory(c){
 editingCategory=c;
 $("catName").value=c.name;
 $("catForm").hidden=false;
 $("catName").focus();
}
$("saveCat").onclick=async()=>{
 const name=$("catName").value.trim();
 if(!name)return alert("اكتب اسم القسم أولًا.");
 $("saveCat").disabled=true;
 try{
  const result=editingCategory?
   await db.from("categories").update({name}).eq("id",editingCategory.id):
   await db.from("categories").insert({name});
  if(result.error)throw result.error;
  $("catForm").hidden=true;
  editingCategory=null;
  await loadAll();
 }catch(e){message("فشل حفظ القسم: "+e.message,true)}
 finally{$("saveCat").disabled=false}
};

$("addProduct").onclick=()=>{
 editingProduct=null;imageUrl="";
 $("pName").value="";$("pPrice").value="";
 $("pNotes").value="";$("pImage").value="";
 $("preview").style.display="none";
 fillCategorySelect();$("pCategory").value="";
 $("productForm").hidden=false;
 $("pName").focus();
};
$("cancelProduct").onclick=()=>{$("productForm").hidden=true;editingProduct=null};

$("pImage").onchange=()=>{
 const file=$("pImage").files[0];
 if(!file){$("preview").style.display="none";return}
 if(!file.type.startsWith("image/")){alert("اختار ملف صورة.");$("pImage").value="";return}
 if(file.size>6*1024*1024){alert("الصورة أكبر من 6 ميجابايت. اختار صورة أصغر.");$("pImage").value="";return}
 $("preview").src=URL.createObjectURL(file);
 $("preview").style.display="block";
};

function editProduct(p){
 if(!p)return;
 editingProduct=p;imageUrl=p.image_url||"";
 $("pName").value=p.name;
 $("pPrice").value=p.price;
 $("pNotes").value=p.notes||"";
 fillCategorySelect();$("pCategory").value=p.category_id;
 $("pImage").value="";
 if(imageUrl){$("preview").src=imageUrl;$("preview").style.display="block"}
 else $("preview").style.display="none";
 $("productForm").hidden=false;
 $("productForm").scrollIntoView({behavior:"smooth",block:"start"});
}
$("saveProduct").onclick=async()=>{
 const name=$("pName").value.trim();
 const price=$("pPrice").value;
 const category_id=$("pCategory").value;
 const notes=$("pNotes").value.trim();
 if(!name||price===""||Number(price)<0||!Number.isFinite(Number(price))||!category_id){
  alert("اكتب اسم المنتج والسعر واختار القسم.");
  return;
 }
 $("saveProduct").disabled=true;
 message("جاري حفظ المنتج...");
 try{
  const file=$("pImage").files[0];
  if(file){
   const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
   const path=Date.now()+"-"+Math.random().toString(36).slice(2)+"."+ext;
   const upload=await db.storage.from("product-images").upload(path,file,{upsert:false,contentType:file.type});
   if(upload.error)throw upload.error;
   imageUrl=db.storage.from("product-images").getPublicUrl(path).data.publicUrl;
  }
  const payload={name,price:Number(price),category_id,notes,image_url:imageUrl||null};
  const result=editingProduct?
   await db.from("products").update(payload).eq("id",editingProduct.id):
   await db.from("products").insert(payload);
  if(result.error)throw result.error;
  $("productForm").hidden=true;editingProduct=null;
  await loadAll();
 }catch(e){
  console.error(e);
  message("فشل حفظ المنتج: "+e.message+"\nقد تحتاج لتشغيل إعداد SQL وصلاحيات الصور في Supabase.",true);
 }finally{$("saveProduct").disabled=false}
};
async function deleteProduct(p){
 if(!p||!confirm("متأكد إنك عايز تحذف المنتج: "+p.name+"؟"))return;
 try{
  const {error}=await db.from("products").delete().eq("id",p.id);
  if(error)throw error;
  await loadAll();
 }catch(e){message("فشل حذف المنتج: "+e.message,true)}
}
loadAll();
if("serviceWorker" in navigator){
 window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
}
</script>
</body>
</html>
